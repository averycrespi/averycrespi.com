<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Writing from Avery Crespi about software, agent tooling, systems, and related experiments."

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="terminal" aria-labelledby="page-title">
      <header class="terminal__header" aria-label="Terminal window header">
        <div class="terminal__controls" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p>averycrespi.com/blog</p>
      </header>

      <section class="terminal__body">
        <p class="prompt"><span>avery@site</span>:~/blog$ ls -l</p>
        <h1 id="page-title">Blog</h1>
        <p class="output">
          The only part of the website that wasn't written by a clanker.
        </p>

        <ol class="post-list output" aria-label="Blog posts">
          <li>
            <span class="post-mode" aria-hidden="true">-rw-r--r--</span>
            <span class="post-owner">avery</span>
            <time datetime="2026-05-31">May 31 2026</time>
            <a href="/blog/hello-world/">hello-world.html</a>
          </li>
        </ol>

        <p class="prompt"><span>avery@site</span>:~/blog$ open links</p>
        <nav class="links output" aria-label="Site links">
          <a href="/">home</a>
        </nav>
      </section>
    </main>
